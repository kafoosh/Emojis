<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emoji Pick</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --pink:#ff5fa2;
    --purple:#9b5cff;
    --blue:#3ad6ff;
    --yellow:#ffe14d;
    --mint:#5dffc7;
    --ink:#1b1130;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Fredoka',system-ui,-apple-system,'Segoe UI',sans-serif;
    color:var(--ink);
    min-height:100%;
    overflow-x:hidden;
    background:
      radial-gradient(circle at 15% 15%, rgba(255,95,162,.55), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(58,214,255,.55), transparent 45%),
      radial-gradient(circle at 80% 85%, rgba(155,92,255,.55), transparent 45%),
      radial-gradient(circle at 20% 90%, rgba(93,255,199,.55), transparent 45%),
      linear-gradient(135deg,#fff0f7,#eef6ff);
    background-attachment:fixed;
  }

  /* floating decorative emoji field */
  #field{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .floaty{position:absolute;font-size:2.6rem;opacity:.16;animation:bob linear infinite;filter:saturate(1.2);}
  @keyframes bob{
    0%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-26px) rotate(12deg);}
    100%{transform:translateY(0) rotate(0deg);}
  }

  .wrap{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:28px 18px 70px;text-align:center;}

  .badge{
    display:inline-block;background:#fff;border:3px solid var(--ink);
    border-radius:999px;padding:6px 16px;font-weight:600;font-size:.85rem;
    box-shadow:4px 4px 0 var(--ink);transform:rotate(-2deg);margin-bottom:14px;
  }
  h1{
    font-size:clamp(2.4rem,8vw,4.5rem);line-height:1;margin:.1em 0 .15em;
    font-weight:700;letter-spacing:-1px;
    background:linear-gradient(90deg,var(--pink),var(--purple),var(--blue));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 3px 0 rgba(27,17,48,.08);
  }
  .sub{font-size:1.05rem;font-weight:500;opacity:.8;max-width:560px;margin:0 auto 18px;}

  .hidden{display:none !important;}

  /* ===== setup screen ===== */
  #setup{
    margin:8px auto 0;max-width:560px;background:#fff;border:4px solid var(--ink);
    border-radius:28px;box-shadow:8px 9px 0 var(--ink);padding:26px 24px 28px;
  }
  #setup h2{margin:0 0 4px;font-size:1.5rem;font-weight:700;}
  #setup .hint{margin:0 0 18px;font-weight:500;opacity:.75;}

  .countbox{
    font-size:3.4rem;font-weight:700;line-height:1;margin:6px 0 4px;
    background:linear-gradient(90deg,var(--pink),var(--purple));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  input[type=range]{
    -webkit-appearance:none;appearance:none;width:100%;height:16px;margin:14px 0 6px;
    background:linear-gradient(90deg,var(--blue),var(--purple));border:3px solid var(--ink);
    border-radius:999px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;
    background:var(--yellow);border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:grab;
  }
  input[type=range]::-moz-range-thumb{
    width:28px;height:28px;border-radius:50%;background:var(--yellow);
    border:3px solid var(--ink);box-shadow:2px 2px 0 var(--ink);cursor:grab;
  }
  .rangeends{display:flex;justify-content:space-between;font-weight:600;font-size:.8rem;opacity:.6;}

  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px;}
  .chip{
    font-family:inherit;font-weight:700;font-size:.95rem;cursor:pointer;
    border:3px solid var(--ink);border-radius:14px;padding:8px 16px;background:#fff;
    box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s,background .1s;
  }
  .chip:hover{transform:translateY(-2px);}
  .chip.active{background:var(--mint);}

  #verdict{
    margin:18px auto 4px;border:3px dashed var(--ink);border-radius:18px;
    padding:14px 16px;background:#fbf7ff;font-weight:600;
  }
  #verdict .first{font-size:1.2rem;display:block;margin-bottom:4px;}
  #verdict .why{font-weight:500;opacity:.8;font-size:.92rem;}

  /* ===== status banner ===== */
  #status{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:#fff;border:3px solid var(--ink);border-radius:22px;
    box-shadow:6px 6px 0 var(--ink);
    padding:14px 18px;font-size:1.15rem;font-weight:600;
    max-width:680px;margin:0 auto 26px;min-height:62px;transition:transform .15s;
  }
  #status .who{
    flex:none;font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;
    color:#fff;padding:5px 12px;border-radius:999px;border:2px solid var(--ink);
  }
  .who.spec{background:var(--blue);}
  .who.bot{background:var(--purple);}
  .who.win{background:var(--mint);}
  #status.pop{transform:scale(1.04);}

  /* ===== emoji board (responsive grid) ===== */
  #board{display:grid;justify-content:center;margin:0 auto;}
  .slot{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;}
  .card{
    width:100%;height:100%;border-radius:22px;border:4px solid var(--ink);
    background:#fff;box-shadow:5px 6px 0 var(--ink);
    font-size:calc(var(--cell,90px) * 0.5);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;user-select:none;position:relative;
    transition:transform .14s ease, box-shadow .14s ease, opacity .3s, filter .3s;
  }
  .card:hover{transform:translateY(-5px) rotate(-2deg);}
  .card:active{transform:translateY(0);box-shadow:2px 3px 0 var(--ink);}
  .card.locked{cursor:default;}
  .card.locked:hover{transform:none;}

  .card.selected{
    background:linear-gradient(135deg,var(--yellow),#ffd000);
    transform:translateY(-6px) scale(1.05) rotate(-3deg);
    box-shadow:0 0 0 4px var(--ink), 6px 8px 0 rgba(27,17,48,.6), 0 0 26px var(--yellow);
  }
  .card.pointed{
    background:linear-gradient(135deg,#d7c2ff,#b79bff);
    animation:wobble .9s ease-in-out infinite;
    box-shadow:0 0 0 4px var(--ink),6px 8px 0 rgba(27,17,48,.5),0 0 26px var(--purple);
  }
  .card.pointed::after{
    content:"👆";position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);
    font-size:1.4rem;animation:tap .9s ease-in-out infinite;
  }
  @keyframes wobble{0%,100%{transform:rotate(-4deg);}50%{transform:rotate(4deg);}}
  @keyframes tap{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}}

  .card.dead{animation:poof .45s ease forwards;pointer-events:none;}
  @keyframes poof{
    0%{transform:scale(1) rotate(0);opacity:1;}
    40%{transform:scale(1.3) rotate(20deg);opacity:1;}
    100%{transform:scale(0) rotate(90deg);opacity:0;}
  }

  .winner .card{
    animation:winspin 1s ease infinite;
    box-shadow:0 0 0 5px var(--ink),0 0 40px var(--blue),0 0 70px var(--pink);
    transform:scale(1.3);
  }
  @keyframes winspin{0%,100%{transform:scale(1.3) rotate(-6deg);}50%{transform:scale(1.4) rotate(6deg);}}

  .controls{margin-top:32px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  button.btn{
    font-family:inherit;font-weight:700;font-size:1rem;cursor:pointer;
    border:3px solid var(--ink);border-radius:16px;padding:12px 22px;
    background:var(--yellow);box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s;
  }
  button.btn:hover{transform:translateY(-2px);box-shadow:6px 6px 0 var(--ink);}
  button.btn:active{transform:translateY(2px);box-shadow:1px 1px 0 var(--ink);}
  button.btn.ghost{background:#fff;}
  button.btn.big{font-size:1.15rem;padding:14px 30px;background:var(--mint);}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden;}
  .conf{position:absolute;top:-40px;font-size:2rem;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}

  footer{margin-top:44px;font-size:.9rem;font-weight:600;opacity:.7;}
  footer a{color:var(--purple);font-weight:700;text-decoration:none;}
</style>
</head>
<body>
<div id="field"></div>
<div id="confetti"></div>

<div class="wrap">
  <span class="badge">🕹️ a tiny web game</span>
  <h1>Emoji Pick</h1>
  <p class="sub">Take turns knocking emojis out, two at a time. Keep going until a single emoji is left standing. 🏆</p>

  <!-- ===== SETUP ===== -->
  <section id="setup">
    <h2>🎮 New game</h2>
    <p class="hint">How many emojis should we start with?</p>

    <div class="countbox"><span id="countNum">8</span> <span style="font-size:1.6rem">emojis</span></div>
    <input type="range" id="countRange" min="3" max="25" value="8" />
    <div class="rangeends"><span>3</span><span>25</span></div>

    <div class="chips" id="chips">
      <button class="chip" data-n="5">5</button>
      <button class="chip active" data-n="8">8</button>
      <button class="chip" data-n="12">12</button>
      <button class="chip" data-n="20">20</button>
    </div>

    <div id="verdict"></div>

    <div class="controls">
      <button class="btn big" id="start">Let's go ✨</button>
    </div>
  </section>

  <!-- ===== GAME ===== -->
  <section id="game" class="hidden">
    <div id="status"><span class="who spec" id="who">You</span><span id="msg"></span></div>
    <div id="board"></div>
    <div class="controls">
      <button class="btn" id="again">🔄 Play Again</button>
      <button class="btn ghost" id="back">⚙️ Change Count</button>
    </div>
  </section>

  <footer>A web app by Kenneth Aidan Foo · <a href="https://oddpaq.com" target="_blank" rel="noopener">@Oddpaq</a></footer>
</div>

<script>
(() => {
  "use strict";
  const TARGET = "💎";
  const POOL = ["🦄","🍕","👽","🔥","🌈","🐸","💀","👾","🎈","🍩","🛸","🦖","🌮","🎸",
                "🪩","🐙","🍓","🚀","🐳","🍔","🎮","🦋","🌵","🍉"]; // 24 others
  const ALL = POOL.concat([TARGET]);                                 // 25 total
  const MINN = 3, MAXN = ALL.length;

  const $ = id => document.getElementById(id);
  const setupEl = $("setup"), gameEl = $("game");
  const boardEl = $("board"), whoEl = $("who"), msgEl = $("msg"), statusEl = $("status");
  const fieldEl = $("field"), confEl = $("confetti");
  const rangeEl = $("countRange"), countNumEl = $("countNum"), verdictEl = $("verdict");

  let deck = [];        // {id,char,alive,slot,card}
  let pointer;          // 'spectator' | 'bot'  (who POINTS this round)
  let phase;            // 'SPEC_POINT' | 'SPEC_ELIM' | 'BUSY' | 'DONE'
  let selected = [];    // ids the player pointed at
  let pointed = [];     // ids the bot pointed at
  let count = 8;        // chosen starting count
  let gameNo = 0;       // increments each deal; only the 1st is rigged
  let rigged = false;   // is the current game forced?
  let uid = 0;

  const aliveDeck = () => deck.filter(d => d.alive);
  const byId = id => deck.find(d => d.id === id);
  const shuffle = a => a.slice().sort(() => Math.random() - 0.5);
  const firstPointer = n => (n % 2 === 0) ? "spectator" : "bot";

  // squarish grid: tiny counts on one row, otherwise a balanced grid
  function gridCols(n){ return n <= 4 ? n : Math.ceil(Math.sqrt(n)); }

  function layoutBoard(){
    const cols = gridCols(count);
    const gap = 12;
    const avail = Math.min(window.innerWidth * 0.92, 760);
    const cell = Math.max(40, Math.min(90, Math.floor((avail - gap * (cols - 1)) / cols)));
    boardEl.style.gridTemplateColumns = "repeat(" + cols + ", " + cell + "px)";
    boardEl.style.gap = gap + "px";
    boardEl.style.setProperty("--cell", cell + "px");
  }

  /* ---------- decorative background ---------- */
  function buildField(){
    fieldEl.innerHTML = "";
    const set = ["🎮","🔥","🌈","🎉","⭐","💫","🍕","🦄","👾","🍩","✨","🎈","🪩","🦋"];
    for(let i=0;i<26;i++){
      const s = document.createElement("span");
      s.className = "floaty";
      s.textContent = set[i % set.length];
      s.style.left = Math.random()*100 + "vw";
      s.style.top = Math.random()*100 + "vh";
      s.style.fontSize = (1.6 + Math.random()*2.6) + "rem";
      s.style.animationDuration = (5 + Math.random()*7) + "s";
      s.style.animationDelay = (-Math.random()*7) + "s";
      fieldEl.appendChild(s);
    }
  }

  /* ---------- setup screen ---------- */
  function updateVerdict(){
    if(firstPointer(count) === "spectator"){
      verdictEl.innerHTML =
        '<span class="first">👉 You go first!</span>' +
        '<span class="why">Even number of emojis — you kick things off.</span>';
    } else {
      verdictEl.innerHTML =
        '<span class="first">🤖 Bot goes first!</span>' +
        '<span class="why">Odd number of emojis — the Bot kicks things off.</span>';
    }
  }

  function setCount(n){
    count = Math.max(MINN, Math.min(MAXN, n|0));
    rangeEl.value = count;
    countNumEl.textContent = count;
    document.querySelectorAll(".chip").forEach(c =>
      c.classList.toggle("active", +c.dataset.n === count));
    updateVerdict();
  }

  /* ---------- game lifecycle ---------- */
  function startGame(){
    setupEl.classList.add("hidden");
    gameEl.classList.remove("hidden");
    dealAndBegin();
  }

  function dealAndBegin(){
    confEl.innerHTML = "";
    boardEl.classList.remove("winner");
    selected = []; pointed = [];
    gameNo++;
    rigged = (gameNo === 1);   // only the very first game (per page load) is forced

    let chars;
    if(rigged){
      chars = shuffle(POOL).slice(0, count - 1).concat([TARGET]);
    } else {
      chars = shuffle(ALL).slice(0, count);   // ordinary random draw, no force
    }
    deck = shuffle(chars).map(c => ({ id: ++uid, char:c, alive:true }));

    render();
    layoutBoard();

    pointer = firstPointer(count);
    if(pointer === "spectator"){
      phase = "SPEC_POINT";
      refreshClasses();
      setStatus("You", "spec", "You're up — tap any TWO emojis.");
    } else {
      startBotPoint(true);
    }
  }

  function render(){
    boardEl.innerHTML = "";
    deck.forEach(d => {
      const slot = document.createElement("div");
      slot.className = "slot";
      const card = document.createElement("div");
      card.className = "card";
      card.textContent = d.char;
      card.dataset.id = d.id;
      card.addEventListener("click", () => onClick(d.id));
      slot.appendChild(card);
      boardEl.appendChild(slot);
      d.slot = slot; d.card = card;
    });
  }

  function setStatus(who, cls, message){
    whoEl.textContent = who;
    whoEl.className = "who " + cls;
    msgEl.textContent = message;
    statusEl.classList.remove("pop");
    void statusEl.offsetWidth;
    statusEl.classList.add("pop");
  }

  function refreshClasses(){
    deck.forEach(d => {
      d.card.classList.toggle("selected", selected.includes(d.id));
      d.card.classList.toggle("pointed", pointed.includes(d.id));
      const clickable =
        (phase === "SPEC_POINT" && d.alive) ||
        (phase === "SPEC_ELIM" && pointed.includes(d.id));
      d.card.classList.toggle("locked", !clickable);
    });
  }

  function onClick(id){
    const d = byId(id);
    if(!d || !d.alive) return;

    if(phase === "SPEC_POINT"){
      if(selected.includes(id)) selected = selected.filter(x => x !== id);
      else if(selected.length < 2) selected.push(id);
      refreshClasses();
      if(selected.length === 2){
        phase = "BUSY";
        refreshClasses();
        setTimeout(botEliminates, 650);
      }
    }
    else if(phase === "SPEC_ELIM"){
      if(!pointed.includes(id)) return;       // can only knock out an offered one
      pointed = [];
      kill(id, () => { if(!checkWin()) startSpectatorPoint(); });
    }
  }

  // Bot removes one of the two the player pointed at.
  function botEliminates(){
    const [a,b] = selected;
    let victim;
    if(rigged && byId(a).char === TARGET) victim = b;
    else if(rigged && byId(b).char === TARGET) victim = a;
    else victim = Math.random() < 0.5 ? a : b;

    selected = [];
    setStatus("Bot", "bot", "Bot knocks out " + byId(victim).char + "!");
    kill(victim, () => { if(!checkWin()) startBotPoint(false); });
  }

  function startSpectatorPoint(){
    pointer = "spectator";
    phase = "SPEC_POINT";
    selected = [];
    refreshClasses();
    setStatus("You", "spec", "Your turn — pick any TWO emojis.");
  }

  // Bot points at two emojis; the player knocks one out.
  function startBotPoint(first){
    pointer = "bot";
    phase = "BUSY";
    refreshClasses();
    setStatus("Bot", "bot", first ? "Bot starts — picking two…" : "Bot's turn — picking two…");

    setTimeout(() => {
      let candidates = aliveDeck();
      if(rigged) candidates = candidates.filter(d => d.char !== TARGET);
      const pick = shuffle(candidates).slice(0, 2).map(d => d.id);
      pointed = pick;
      phase = "SPEC_ELIM";
      refreshClasses();
      setStatus("Bot", "bot", "Bot points at these 👇 you knock one out!");
    }, 750);
  }

  function kill(id, done){
    const d = byId(id);
    if(!d){ done && done(); return; }
    d.alive = false;
    d.card.classList.remove("selected","pointed");
    d.card.classList.add("dead","locked");
    refreshClasses();
    setTimeout(() => {
      d.slot.style.display = "none";   // remove from the grid, board reflows
      done && done();
    }, 450);
  }

  function checkWin(){
    const left = aliveDeck();
    if(left.length === 1){
      phase = "DONE";
      const champ = left[0];
      boardEl.classList.add("winner");
      setStatus("Winner", "win", "🏆 " + champ.char + " is the last one standing!");
      celebrate();
      return true;
    }
    return false;
  }

  function celebrate(){
    const bits = ["🎉","✨","🎊","💫","⭐","🥳","🔥","🌈"];
    for(let i=0;i<60;i++){
      const c = document.createElement("span");
      c.className = "conf";
      c.textContent = bits[Math.floor(Math.random()*bits.length)];
      c.style.left = Math.random()*100 + "vw";
      c.style.fontSize = (1.2 + Math.random()*2.2) + "rem";
      c.style.animationDuration = (2.2 + Math.random()*2.6) + "s";
      c.style.animationDelay = (Math.random()*0.8) + "s";
      confEl.appendChild(c);
      setTimeout(() => c.remove(), 5200);
    }
  }

  /* ---------- wiring ---------- */
  rangeEl.addEventListener("input", () => setCount(+rangeEl.value));
  $("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if(b) setCount(+b.dataset.n);
  });
  $("start").addEventListener("click", startGame);
  $("again").addEventListener("click", dealAndBegin);
  $("back").addEventListener("click", () => {
    gameEl.classList.add("hidden");
    setupEl.classList.remove("hidden");
  });
  window.addEventListener("resize", () => {
    if(!gameEl.classList.contains("hidden")) layoutBoard();
  });

  buildField();
  setCount(8);
})();
</script>
</body>
</html>
